name: huellitas-chatbot

services:
  agent-api:
    image: huellitas-chatbot:local
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      HUELLITAS_HOST: "0.0.0.0"
      HUELLITAS_PORT: "8000"
      HUELLITAS_VECTOR_STORE_ENABLED: "true"
      HUELLITAS_QDRANT_URL: "http://qdrant:6333"
      HUELLITAS_REDIS_ENABLED: "true"
      HUELLITAS_REDIS_URL: "redis://redis:6379"
      HUELLITAS_CHECKPOINT_PROVIDER: "redis"
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    networks:
      - automation

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - automation
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  redis:
    image: redis:8.8.2-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_storage:/data
    restart: unless-stopped
    networks:
      - automation
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

networks:
  automation:
    driver: bridge

volumes:
  qdrant_storage:
  redis_storage:
