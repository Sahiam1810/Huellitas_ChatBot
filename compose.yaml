name: huellitas-chatbot

# LOCAL / DEV ONLY — no usar como despliegue de producción.
# Producción del stack completo: ../docker-compose.prod.yml
#   (DNS `chatbot`, sin publish de 8010 / 6379 / 6333 / 6334).
#
# Este archivo publica solo en 127.0.0.1 para DX local.
# Red propia `huellitas_local` (no external). Stack completo: Compose padre.

services:
  chatbot:
    image: huellitas-chatbot:local
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      HUELLITAS_HOST: "0.0.0.0"
      HUELLITAS_PORT: "8010"
      HUELLITAS_VECTOR_STORE_ENABLED: "true"
      HUELLITAS_QDRANT_URL: "http://qdrant:6333"
      HUELLITAS_REDIS_ENABLED: "true"
      HUELLITAS_REDIS_URL: "redis://redis:6379"
      HUELLITAS_CHECKPOINT_PROVIDER: "redis"
      HUELLITAS_BACKEND_ENABLED: "true"
      # DNS del servicio backend (Compose padre o docker-compose local del backend).
      HUELLITAS_BACKEND_BASE_URL: "http://backend:8080"
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:8010:8010"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - huellitas_local

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - huellitas_local
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  redis:
    image: redis:8.8.2-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_storage:/data
    restart: unless-stopped
    networks:
      - huellitas_local
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

networks:
  huellitas_local:
    name: huellitas_local
    driver: bridge

volumes:
  qdrant_storage:
  redis_storage:
