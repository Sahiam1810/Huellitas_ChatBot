[project]
name = "huellitas-chatbot"
version = "0.1.0"
description = "Servicio modular de automatización conversacional veterinaria"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.19.0",
    "httpx>=0.28.1",
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-redis>=0.5.2,<0.6",
    "openai>=3.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.10.1,<3.0.0",
    "qdrant-client>=1.19.0,<2.0.0",
    "redis>=7.1,<8",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
cache-dir = ".cache/uv"

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]

[tool.coverage.run]
branch = true
source = ["app"]
data_file = ".cache/.coverage"

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = ".cache/htmlcov"

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]
